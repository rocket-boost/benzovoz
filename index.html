<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-color: #800020; /* Бордовый */
            --accent-color: #a52a2a;   /* Светлее бордо */
            --bg-body: #fdfcfc;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #fff; 
            color: #333; 
            padding: 20px; 
            margin: 0;
        }

        h3 { color: var(--primary-color); text-align: center; margin-bottom: 25px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .card { 
            padding: 20px 10px; 
            border-radius: 16px; 
            background: #fff; 
            text-align: center; 
            cursor: pointer; 
            border: 2px solid #eee;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .card:hover { transform: translateY(-2px); }

        .card.active { 
            border-color: var(--primary-color); 
            background: #fff5f5;
            color: var(--primary-color);
            box-shadow: 0 0 15px rgba(128, 0, 32, 0.2);
        }

        .hidden { display: none; }

        #amount {
            width: 100%; 
            padding: 15px; 
            border-radius: 12px; 
            border: 2px solid #eee; 
            font-size: 16px;
            background-color: #f9f9f9;
            color: var(--primary-color);
            font-weight: bold;
            outline: none;
        }

        label { display: block; margin-bottom: 10px; font-weight: 500; color: #666; }
    </style>
</head>
<body>
    <div id="step1">
        <h3>Выберите АЗС</h3>
        <div class="grid">
            <div class="card" onclick="selectGas('Лукойл', this)">Лукойл</div>
            <div class="card" onclick="selectGas('Роснефть', this)">Роснефть</div>
            <div class="card" onclick="selectGas('Газпром', this)">Газпром</div>
            <div class="card" onclick="selectGas('Татнефть', this)">Татнефть</div>
        </div>
    </div>

    <div id="step2" class="hidden">
        <h3 id="selectedGas" style="text-align: left; border-bottom: 2px solid var(--primary-color); padding-bottom: 10px;"></h3>
        <label>Выберите желаемый номинал:</label>
        <select id="amount">
            <option value="5000">5000 баллов — 4000 руб</option>
            <option value="10000">10 000 баллов — 8000 руб</option>
            <option value="25000">25 000 баллов — 18 750 руб</option>
            <option value="50000">50 000 баллов — 36 000 руб</option>
            <option value="100000">100 000 баллов — 70 000 руб</option>
        </select>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        let selectedGas = '';
        let mb = tg.MainButton;
        
        // Настройка кнопки Telegram
        mb.setText("ПЕРЕЙТИ К ОПЛАТЕ");
        mb.setParams({color: "#800020", text_color: "#ffffff"});

        function selectGas(gas, el) {
            selectedGas = gas;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('selectedGas').innerText = '⛽ ' + gas;
            mb.show();
        }

        tg.onEvent('mainButtonClicked', function(){
            let amount = document.getElementById('amount').value;
            tg.sendData(JSON.stringify({ "gas": selectedGas, "amount": amount }));
            tg.close();
        });
    </script>
</body>
</html>
