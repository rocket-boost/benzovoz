<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-color: #800020;
            --bg-gradient: linear-gradient(135deg, #2d000b 0%, #800020 100%);
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-gradient); 
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
        }
        .page { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        h3 { text-align: center; margin-bottom: 25px; font-weight: 300; letter-spacing: 1px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .card { 
            padding: 20px; border-radius: 20px; background: rgba(255,255,255,0.1); 
            backdrop-filter: blur(10px); text-align: center; cursor: pointer; 
            border: 2px solid rgba(255,255,255,0.1); transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .card:hover, .card.active { border-color: #ff4d4d; background: rgba(255,255,255,0.2); transform: scale(0.98); }
        .card img { width: 50px; height: 50px; object-fit: contain; }
        
        .hidden { display: none; }
        
        .back-btn { 
            background: none; border: 1px solid rgba(255,255,255,0.3); color: #fff; 
            padding: 8px 15px; border-radius: 10px; cursor: pointer; margin-bottom: 20px;
        }
        
        select { 
            width: 100%; padding: 15px; border-radius: 15px; border: none; 
            background: rgba(255,255,255,0.9); font-size: 16px; color: #333;
        }
    </style>
</head>
<body>

    <div id="step1" class="page">
        <h3>Выберите АЗС</h3>
        <div class="grid">
            <div class="card" onclick="selectGas('Лукойл', this)">
                <img src="https://cdn-icons-png.flaticon.com/512/3596/3596092.png" alt="Лукойл">
                Лукойл
            </div>
            <div class="card" onclick="selectGas('Роснефть', this)">
                <img src="https://cdn-icons-png.flaticon.com/512/3596/3596080.png" alt="Роснефть">
                Роснефть
            </div>
            <div class="card" onclick="selectGas('Газпром', this)">
                <img src="https://cdn-icons-png.flaticon.com/512/3596/3596085.png" alt="Газпром">
                Газпром
            </div>
            <div class="card" onclick="selectGas('Татнефть', this)">
                <img src="https://cdn-icons-png.flaticon.com/512/3596/3596095.png" alt="Татнефть">
                Татнефть
            </div>
        </div>
    </div>

    <div id="step2" class="page hidden">
        <button class="back-btn" onclick="goBack()">← Назад</button>
        <h3 id="selectedGas"></h3>
        <p>Выберите номинал:</p>
        <select id="amount">
            <option value="5000">5000 баллов - 4000 руб</option>
            <option value="10000">10 000 баллов - 8000 руб</option>
            <option value="25000">25 000 баллов - 18 750 руб</option>
            <option value="50000">50 000 баллов - 36 000 руб</option>
            <option value="100000">100 000 баллов - 70 000 руб</option>
        </select>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        let selectedGas = '';
        let mb = tg.MainButton;
        
        mb.setText("ПЕРЕЙТИ К ОПЛАТЕ");
        mb.setParams({color: "#800020", text_color: "#ffffff"});

        function selectGas(gas, el) {
            selectedGas = gas;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('selectedGas').innerText = '⛽ ' + gas;
            
            mb.show();
            mb.enable();
        }

        function goBack() {
            document.getElementById('step1').classList.remove('hidden');
            document.getElementById('step2').classList.add('hidden');
            mb.hide();
        }

        tg.onEvent('mainButtonClicked', function(){
            let amount = document.getElementById('amount').value;
            tg.sendData(JSON.stringify({ "gas": selectedGas, "amount": amount }));
            tg.close();
        });
    </script>
</body>
</html>
