<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-color: #800020;
            --bg-gradient: linear-gradient(135deg, #2d000b 0%, #800020 100%);
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-gradient); 
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Фон со звездочками */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Чтобы контент был поверх звезд */
        .page { 
            position: relative;
            z-index: 1;
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; 
            opacity: 0;
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        h3 { text-align: center; margin-bottom: 25px; font-weight: 300; letter-spacing: 1px; }
        
        /* Сетка АЗС таблицей */
        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            padding: 10px 5px 20px 5px;
        }
        
        /* Эффект матового стекла (Glassmorphism) с градиентной каймой */
        .card { 
            padding: 25px 15px; 
            border-radius: 24px; 
            background: rgba(255, 255, 255, 0.07); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            text-align: center; 
            cursor: pointer; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 12px;
            box-sizing: border-box;
        }
        .card:hover, .card.active { 
            border-color: #ff4d4d; 
            background: rgba(255, 255, 255, 0.15); 
            transform: scale(0.96) translateY(-2px); 
            box-shadow: 0 12px 40px 0 rgba(255, 77, 77, 0.2);
        }
        .card img { 
            width: 55px; 
            height: 55px; 
            object-fit: contain; 
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }
        
        .hidden { display: none !important; }
        
        /* Кнопка назад в стиле стекла */
        .back-btn { 
            background: rgba(255, 255, 255, 0.07); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15); 
            color: #fff; 
            padding: 10px 20px; 
            border-radius: 12px; 
            cursor: pointer; 
            margin-bottom: 25px;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        /* Выпадающий список в стиле стекла */
        select { 
            width: 100%; 
            padding: 16px; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            background: rgba(255, 255, 255, 0.1); 
            font-size: 16px; 
            color: #fff;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            box-sizing: border-box;
        }
        select option {
            background: #2d000b;
            color: #fff;
        }

        #infoText {
            margin-top: 25px;
            padding: 18px;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
            border-left: 4px solid #ff4d4d;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.05);
        }

        .footer-links { margin-top: 40px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .footer-links a { color: rgba(255,255,255,0.45); font-size: 12px; text-decoration: none; border-bottom: 1px dashed rgba(255,255,255,0.3); padding-bottom: 2px; transition: 0.3s; }
        .footer-links a:hover { color: rgba(255,255,255,0.8); border-bottom-color: rgba(255,255,255,0.8); }
    </style>
</head>
<body>

    <!-- Холст для летящих звездочек -->
    <canvas id="starfield"></canvas>

    <div id="step1" class="page">
        <h3>Выберите АЗС</h3>
        <div class="grid">
            <div class="card" onclick="selectGas('Лукойл', this)">
                <img src="lukoil.png" alt="Лукойл">
                Лукойл
            </div>
            <div class="card" onclick="selectGas('Роснефть', this)">
                <img src="rosneft.png" alt="Роснефть">
                Роснефть
            </div>
            <div class="card" onclick="selectGas('Газпром', this)">
                <img src="gazprom.png" alt="Газпром">
                Газпром
            </div>
            <div class="card" onclick="selectGas('Татнефть', this)">
                <img src="tatneft.png" alt="Татнефть">
                Татнефть
            </div>
        </div>
        <div class="footer-links">
            <a href="https://telegra.ph/POLITIKA-KONFIDENCIALNOSTI-PO-RABOTE-S-PERSONALNYMI-DANNYMI-POLZOVATELEJ-02-14-3" target="_blank">Политика конфиденциальности</a>
            <a href="https://telegra.ph/POLZOVATELSKOE-SOGLASHENIE-02-14-28" target="_blank">Пользовательское соглашение</a>
        </div>
    </div>

    <div id="step2" class="page hidden">
        <button class="back-btn" onclick="goBack()">← Назад</button>
        <h3 id="selectedGas"></h3>
        <p style="padding-left: 5px; margin-bottom: 10px; font-size: 15px; color: rgba(255,255,255,0.7);">Выберите номинал:</p>
        <select id="amount">
            <option value="5000">5000 баллов - 4000 руб</option>
            <option value="10000">10 000 баллов - 8000 руб</option>
            <option value="25000">25 000 баллов - 18 750 руб</option>
            <option value="50000">50 000 баллов - 36 000 руб</option>
            <option value="100000">100 000 баллов - 70 000 руб</option>
        </select>
        <div id="infoText"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        let selectedGas = '';
        let mb = tg.MainButton;

        const gasInfo = {
            'Лукойл': '«Лукойл — это символ надежности и передовых технологий в мире топлива. Выбирая АЗС «Лукойл», вы доверяете свой автомобиль одному из лидеров отрасли, где качество бензина и дизеля проходит строжайший контроль на каждом этапе производства — от нефтеперерабатывающего завода до топливораздаточной колонки. Специальные присадки в составе фирменного топлива помогают не только очищать двигатель от нагара, но и повышать его эффективность, обеспечивая плавный ход и экономичный расход.',
            'Роснефть': '«Роснефть — энергия вашего движения. Выбирая АЗС «Роснефть», вы делаете ставку на топливо, отвечающее самым высоким экологическим и эксплуатационным стандартам. Мы глубоко понимаем потребности современных водителей, поэтому предлагаем продукты, которые не просто обеспечивают стабильную работу двигателя, но и заботятся о его долговечности в любых дорожных условиях. Мощная производственная база и жесткий контроль качества — это фундамент нашего доверия с миллионами автомобилистов.',
            'Газпром': 'Газпромнефть — высокие технологии для вашего автомобиля. Мы постоянно совершенствуем наши стандарты, чтобы предлагать вам топливо, соответствующее требованиям самых современных двигателей. Наша сеть — это синергия передовых разработок в области нефтепереработки и безупречного клиентского сервиса. Заправляясь на АЗС «Газпромнефть», вы выбираете уверенность в качестве, подтвержденном международными стандартами, и динамику, которая позволит вам получать настоящее удовольствие от вождения.',
            'Татнефть': '«Татне́фть» — российская нефтяная компания. Отличается своей историей и будущим в перспективе. Качество топлива на высшем уровне. Всего насчитывается более 770 заправочных станций на территории РФ'
        };
        
        mb.setText("ПЕРЕЙТИ К ОПЛАТЕ");
        mb.setParams({color: "#800020", text_color: "#ffffff"});

        function selectGas(gas, el) {
            selectedGas = gas;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            
            // Плавное переключение экранов
            document.getElementById('step1').classList.add('hidden');
            
            let step2 = document.getElementById('step2');
            step2.classList.remove('hidden');
            // Перезапуск анимации появления
            step2.style.animation = 'none';
            step2.offsetHeight; 
            step2.style.animation = null;

            document.getElementById('selectedGas').innerText = '⛽ ' + gas;
            document.getElementById('infoText').innerText = gasInfo[gas];
            
            mb.show();
            mb.enable();
        }

        function goBack() {
            document.getElementById('step2').classList.add('hidden');
            
            let step1 = document.getElementById('step1');
            step1.classList.remove('hidden');
            // Перезапуск анимации появления
            step1.style.animation = 'none';
            step1.offsetHeight; 
            step1.style.animation = null;

            mb.hide();
        }

        tg.onEvent('mainButtonClicked', function(){
            let amount = document.getElementById('amount').value;
            tg.sendData(JSON.stringify({ "gas": selectedGas, "amount": amount }));
            tg.close();
        });

        // --- Логика анимации случайных звездочек на фоне ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let stars = [];
        const numStars = 40; // Количество маленьких звездочек

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5 + 0.5,
                    vx: (Math.random() - 0.5) * 0.3, // Случайная скорость X
                    vy: (Math.random() - 0.5) * 0.3, // Случайная скорость Y
                    alpha: Math.random() * 0.5 + 0.3
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';

            for (let i = 0; i < numStars; i++) {
                let s = stars[i];
                ctx.beginPath();
                ctx.globalAlpha = s.alpha;
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();

                // Движение звездочек
                s.x += s.vx;
                s.y += s.vy;

                // Если звезда улетает за край, возвращаем её с противоположной стороны
                if (s.x < 0) s.x = canvas.width;
                if (s.x > canvas.width) s.x = 0;
                if (s.y < 0) s.y = canvas.height;
                if (s.y > canvas.height) s.y = 0;
            }
            ctx.globalAlpha = 1.0;
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            initStars();
        });

        resizeCanvas();
        initStars();
        drawStars();
    </script>
</body>
</html>
