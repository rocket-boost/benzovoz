<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { padding: 15px; border-radius: 12px; background: var(--tg-theme-secondary-bg-color); text-align: center; cursor: pointer; border: 2px solid transparent; }
        .card.active { border-color: #2481cc; border: 2px solid #2481cc; }
        .hidden { display: none; }
        h3 { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="step1">
        <h3>Выберите АЗС:</h3>
        <div class="grid">
            <div class="card" onclick="selectGas('Лукойл', this)">Лукойл</div>
            <div class="card" onclick="selectGas('Роснефть', this)">Роснефть</div>
            <div class="card" onclick="selectGas('Газпром', this)">Газпром</div>
            <div class="card" onclick="selectGas('Татнефть', this)">Татнефть</div>
        </div>
    </div>

    <div id="step2" class="hidden">
        <h3 id="selectedGas"></h3>
        <p>Выберите номинал:</p>
        <select id="amount" style="width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;">
            <option value="5000">5000 баллов - 4000 руб</option>
            <option value="10000">10 000 баллов - 8000 руб</option>
            <option value="25000">25 000 баллов - 18 750 руб</option>
            <option value="50000">50 000 баллов - 36 000 руб</option>
            <option value="100000">100 000 баллов - 70 000 руб</option>
        </select>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        let selectedGas = '';
        let mb = tg.MainButton;
        mb.setText("ПОДТВЕРДИТЬ ЗАКАЗ");

        function selectGas(gas, el) {
            selectedGas = gas;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('selectedGas').innerText = 'АЗС: ' + gas;
            mb.show();
        }

        tg.onEvent('mainButtonClicked', function(){
            let amount = document.getElementById('amount').value;
            tg.sendData(JSON.stringify({ "gas": selectedGas, "amount": amount }));
        });
    </script>
</body>
</html>
