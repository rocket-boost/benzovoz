<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { padding: 15px; border-radius: 12px; background: var(--tg-theme-secondary-bg-color); text-align: center; cursor: pointer; border: 2px solid transparent; }
        .card.active { border-color: #2481cc; }
        .hidden { display: none; }
        button { width: 100%; padding: 15px; margin-top: 20px; border-radius: 10px; border: none; background: #2481cc; color: white; font-weight: bold; }
    </style>
</head>
<body>
    <div id="step1">
        <h3>Выберите АЗС:</h3>
        <div class="grid">
            <div class="card" onclick="selectGas('Лукойл')">Лукойл</div>
            <div class="card" onclick="selectGas('Роснефть')">Роснефть</div>
            <div class="card" onclick="selectGas('Газпром')">Газпром</div>
            <div class="card" onclick="selectGas('Татнефть')">Татнефть</div>
        </div>
    </div>

    <div id="step2" class="hidden">
        <h3 id="selectedGas"></h3>
        <p>Выберите номинал:</p>
        <select id="amount" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
            <option value="5000">5000 баллов - 4000 руб</option>
            <option value="10000">10 000 баллов - 8000 руб</option>
            <option value="25000">25 000 баллов - 18 750 руб</option>
            <option value="50000">50 000 баллов - 36 000 руб</option>
            <option value="100000">100 000 баллов - 70 000 руб</option>
        </select>
        <button onclick="confirmOrder()">Перейти к оплате</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let selectedGas = '';

        function selectGas(gas) {
            selectedGas = gas;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('selectedGas').innerText = 'АЗС: ' + gas;
        }

        function confirmOrder() {
            let amount = document.getElementById('amount').value;
            let data = {
                "gas": selectedGas,
                "amount": amount
            };
            
            // Отправляем данные в бота
            tg.sendData(JSON.stringify(data));
            
            // Принудительно закрываем приложение
            tg.close();
        }
    </script>
</body>
</html>
